name: Refresh SEC annual financials
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-equities.mjs'
      - 'app/equity-engine.mjs'
      - '.github/workflows/equity-data.yml'
permissions:
  contents: write
concurrency:
  group: equity-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-equities.mjs
      - run: node --test tests/equity.test.mjs
      - name: Commit validated public financial facts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/equities.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated SEC annual financial facts'
          git push origin HEAD:main
