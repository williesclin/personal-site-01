name: Refresh SEC annual financials
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-equities.mjs'
      - 'app/equity-engine.mjs'
      - 'app/ai-universe.mjs'
      - '.github/workflows/equity-data.yml'
permissions:
  contents: write
concurrency:
  group: research-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-equities.mjs
      - run: node --test tests/equity.test.mjs
      - name: Commit validated public financial facts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/equities.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated SEC annual financial facts'
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase origin main
            node scripts/build-research-sync.mjs
            git add data/research-sync.json
            git diff --cached --quiet || git commit -m 'Prepare verified database synchronization manifest'
            if git push origin HEAD:main; then pushed=true; break; fi
          done
          test "$pushed" = true
