name: Refresh research filing observations
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-research-feed.mjs'
      - 'scripts/build-research-sync.mjs'
      - '.github/workflows/research-feed.yml'
permissions:
  contents: write
concurrency:
  group: research-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-research-feed.mjs
      - name: Commit validated metadata and synchronization envelope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-feed.json
          git diff --cached --quiet || git commit -m 'Refresh official SEC filing observations'
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase origin main
            node scripts/build-research-sync.mjs
            git add data/research-sync.json
            git diff --cached --quiet || git commit -m 'Prepare verified database synchronization manifest'
            if git push origin HEAD:main; then pushed=true; break; fi
          done
          test "$pushed" = true
