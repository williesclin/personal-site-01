name: Refresh U.S. lottery results
on:
  schedule:
    - cron: '30 12,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-us-lottery.mjs'
      - 'tests/us-lottery-data.test.mjs'
      - '.github/workflows/us-lottery-data.yml'
permissions:
  contents: write
concurrency:
  group: us-lottery-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-us-lottery.mjs
      - run: node --test tests/us-lottery-data.test.mjs
      - name: Commit validated U.S. draw history only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/us-powerball.json data/us-megamillions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated U.S. lottery history'
          git pull --rebase origin main
          git push origin HEAD:main
