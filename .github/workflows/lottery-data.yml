name: Refresh official lottery data
on:
  schedule:
    - cron: '45 13,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-lottery.mjs'
      - 'app/lottery-engine.mjs'
      - '.github/workflows/lottery-data.yml'
permissions:
  contents: write
concurrency:
  group: lottery-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-lottery.mjs
      - run: node --test tests/lottery-data.test.mjs
      - name: Commit validated public data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lotto649.json data/superlotto638.json data/daily539.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated Taiwan Lottery history'
          git pull --rebase origin main
          git push origin HEAD:main
